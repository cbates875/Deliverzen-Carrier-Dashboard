<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LITE · Deliverzen Shipping Analytics Dashboard</title>
<style>
*{box-sizing:border-box} html,body{margin:0;padding:0} body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%);color:#333;min-height:100vh}
#filterBar{position:sticky;top:0;z-index:1000;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:16px 20px;box-shadow:0 5px 18px rgba(0,0,0,.16);color:#fff} .filter-wrapper{max-width:1500px;margin:auto} .filter-row{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px;align-items:end} .filter-group{display:flex;flex-direction:column;gap:5px} .filter-group label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.55px} select,input{padding:10px 11px;border:0;border-radius:6px;background:#fff;color:#333;font-size:13px;font-weight:600;min-width:0} .filter-buttons{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center} .reset-all-btn{padding:10px 25px;border:0;border-radius:6px;background:#fff;color:#667eea;font-weight:700;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.12)} .apply-btn{background:#4CAF50;color:#fff} .quick-filter-btn{padding:6px 10px;border-radius:4px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:700;cursor:pointer} .quick-filter-btn.active{background:#fff;color:#667eea} #activeRange{padding:7px 11px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.13);border-radius:6px;font-size:11px;font-weight:600}
.page-wrapper{padding:20px} .container{max-width:1500px;margin:auto} .page-header{background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:24px;display:flex;align-items:center;gap:28px} .logo-container img{height:62px;width:auto;display:block} .page-header h1{margin:0 0 7px;font-size:32px} .subtitle{color:#667eea;font-weight:700} .source-note{font-size:12px;color:#777;margin-top:5px}
.tab-navigation{display:flex;gap:9px;background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:20px;flex-wrap:wrap} .tab-nav-btn{padding:10px 17px;border:2px solid #ddd;background:#fff;color:#666;font-weight:650;font-size:13px;cursor:pointer;border-radius:8px} .tab-nav-btn.active{background:#667eea;color:#fff;border-color:#667eea} .tab-pane{display:none} .tab-pane.active{display:block}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:18px;margin-bottom:24px} .kpi-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);border-left:5px solid #667eea} .kpi-label{color:#999;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px} .kpi-value{font-size:27px;font-weight:700;font-family:'Courier New',monospace;margin-bottom:4px} .kpi-detail{font-size:12px;color:#666;line-height:1.4} .highlight-positive{color:#22c55e!important} .highlight-negative{color:#ef4444!important}
.section{background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:22px} .section-title{font-size:18px;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:3px solid #667eea} .charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:20px;margin-bottom:22px} .chart-card{background:#fff;padding:19px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);min-height:355px} .chart-title{font-size:14px;font-weight:700;text-align:center;margin-bottom:10px} .svg-chart{width:100%;height:300px;overflow:visible} .bar-label{font-size:10px;fill:#555} .bar-value{font-size:9px;fill:#444} .legend-text{font-size:10px;fill:#555}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:20px} .metric-box{background:linear-gradient(135deg,#667eea15 0%,#764ba215 100%);padding:15px;border-radius:8px;border:1px solid #667eea33;text-align:center} .metric-label{font-size:12px;color:#666;font-weight:600;text-transform:uppercase} .metric-value{font-size:24px;font-weight:700;color:#667eea;font-family:'Courier New',monospace;margin-top:6px}
.sla-table{width:100%;border-collapse:collapse;border:1px solid #e0e7ff;border-radius:8px;overflow:hidden} .sla-table td{padding:18px 15px;border-bottom:1px solid #e8ecf1} .sla-table tr:nth-child(odd){background:linear-gradient(90deg,#e8ecf8 0%,#f0f4ff 100%)} .sla-table tr:nth-child(even){background:linear-gradient(90deg,#fff 0%,#f8fafb 100%)} .status-badge{padding:8px 14px;border-radius:20px;font-weight:650;font-size:12px;display:inline-block} .status-pass{background:#d4edda;color:#155724} .status-fail{background:#f8d7da;color:#721c24} .status-neutral{background:#e3f2fd;color:#1565c0}
.info{background:#f0f3ff;border-left:5px solid #667eea;padding:11px 13px;border-radius:6px;margin-bottom:18px;font-size:12px;color:#4d5570} .warn{background:#fff8e1;border-left-color:#f6c344;color:#775d00}
.table-wrap{overflow:auto;max-height:610px;border:1px solid #e5e8f0;border-radius:8px} table.data{width:100%;border-collapse:collapse;font-size:12px} table.data th{position:sticky;top:0;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:10px;text-align:left;z-index:2} table.data td{padding:9px;border-bottom:1px solid #eee} table.data tbody tr:nth-child(even){background:#fafbff} td.num,th.num{text-align:right} .source-pill{padding:3px 7px;border-radius:10px;background:#eef0ff;color:#667eea;font-size:10px;font-weight:700}
@media(max-width:1100px){.filter-row{grid-template-columns:repeat(2,minmax(180px,1fr))}} @media(max-width:700px){.filter-row{grid-template-columns:1fr} .page-header{flex-direction:column;text-align:center} .charts-grid{grid-template-columns:1fr}}

.zone-heatmap{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;font-size:12px}.zone-card{color:white;padding:15px;border-radius:6px;text-align:center;box-shadow:0 2px 7px rgba(0,0,0,.12)}.zone-card .zone-name{font-weight:700}.zone-card .zone-value{font-size:20px;margin:8px 0;font-weight:800}.zone-card .zone-detail{font-size:11px}.zone-note{margin-top:15px;font-size:12px;color:#666}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.summary-card{padding:16px;background:linear-gradient(135deg,#f5f7fa 0%,#e7ecf8 100%);border-radius:8px;border-left:4px solid #667eea}.summary-card-title{font-weight:700;color:#333;font-size:12px;text-transform:uppercase;margin-bottom:6px}.summary-card-content{font-size:13px;color:#555;line-height:1.55}.status-overall-pass{background:#d4edda;color:#155724}.status-overall-fail{background:#f8d7da;color:#721c24}@media(max-width:800px){.zone-heatmap{grid-template-columns:1fr 1fr}}
</style>
<style>
.chart-card{min-height:640px!important;padding:28px!important}.chart-title{font-size:20px!important;margin-bottom:16px!important}.svg-chart{height:auto!important;display:block!important}.bar-label,.legend-text{font-size:16px!important}.bar-value{font-size:15px!important}.charts-grid{grid-template-columns:repeat(auto-fit,minmax(620px,1fr))!important;gap:26px!important}
.comparison-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-bottom:22px}.comparison-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}.comparison-card h3{font-size:18px;margin:0 0 14px}.comparison-card table{font-size:14px}.comparison-card th,.comparison-card td{padding:13px 12px}.access-summary{margin-top:22px}@media(max-width:1150px){.charts-grid,.comparison-grid{grid-template-columns:1fr}}
</style>

function renderShipHero(){const S0=window.DZSH,f0=filters();let S=S0;

  const cc=S0.cust_carrier.filter(r=>(!f0.customer||r[0]===f0.customer)&&(f0.carrier==='all'||r[1]===f0.carrier));
  const cm=S0.cust_month.filter(r=>(!f0.customer||r[0]===f0.customer));
  const roll=(rows,ki)=>{const mm={};for(const r of rows){const v=mm[r[ki]]||(mm[r[ki]]=[0,0,0,0]);v[0]+=r[2];v[1]+=r[3];v[2]+=r[4];v[3]+=r[5];}
   return Object.entries(mm).map(([k,v])=>[k,v[0],v[1],__r2(v[2]),__r2(v[3])]);};
  const tot=cc.reduce((a,r)=>[a[0]+r[2],a[1]+r[3],a[2]+r[4],a[3]+r[5]],[0,0,0,0]);
  S=Object.assign({},S0,{filtered:true,cust_carrier:cc,cust_month:cm,
   customers:roll(cc,0).sort((a,b)=>b[1]-a[1]),
   carriers:roll(cc,1).sort((a,b)=>b[1]-a[1]),
   months:roll(cm,1).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))),
   totals:Object.assign({},S0.totals,{ship:tot[0],labels:tot[1],cost:__r2(tot[2]),weight:__r2(tot[3]),
    customers:new Set(cc.map(r=>r[0])).size,carriers:new Set(cc.map(r=>r[1])).size,
    ship_by_carrier_sum:tot[0],ship_by_month_sum:cm.reduce((a,r)=>a+r[2],0)})});
 }
 const T=S.totals,R=S.recon;
const cov=T.ship?100*S.export_ship/T.ship:0;
const kpis=`<div class="kpi-grid">${card('Total Shipments',fmt(T.ship),'Billable — valid label + customer record')}${card('Total Label Cost',money(T.cost),'Avg '+money(T.ship?T.cost/T.ship:0)+'/shipment')}${card('Shipping Labels',fmt(T.labels),fmt(T.labels/T.ship,2)+' labels per shipment')}${card('Customers',fmt(T.customers),fmt(T.carriers)+' carriers used')}</div>`;
const banner=`<div class="info"><b>This tab is the authoritative shipment count</b>, pulled directly from ShipHero via Snowflake for ${esc(S.period)} (${esc(S.source)}). Every other tab is built from uploaded customer CSV exports, which cover ${fmt(S.export_ship)} shipments — ${fmt(cov,1)}% of the billable total. Use this tab for totals; use the other tabs for per-shipment, destination and tracking detail on the customers whose exports are loaded.</div>`;
const reconRows=[
 ['Shipment records in ShipHero for the period',R.table_total,''],
 ['Less: shipments with no shipping label at all',-R.no_labels,'Never shipped / label never generated'],
 ['Less: shipments whose only labels were voided',-R.only_void,'Voided labels carry no billable cost'],
 ['Subtotal — shipments with at least one valid label',R.has_valid,''],
 ['Less: valid labels with no matching customer record',-R.unattributed,'Order or account missing from ShipHero customer table'],
 ['<b>Billable shipments (headline figure)</b>',R.billable,'Basis for all figures on this tab']
].concat(R.tail_ship?[
 ['Add: '+esc(R.tail_from)+' to '+esc(R.tail_to)+' from customer export',R.tail_ship,'Export carries labels only — see note below'],
 ['<b>Total shipments</b>',R.grand,'Warehouse + export tail']
]:[]).map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]<0?'('+fmt(Math.abs(r[1]))+')':'<b>'+fmt(r[1])+'</b>'}</td><td>${esc(r[2])}</td></tr>`);
const recon=S.filtered?`<div class="info"><b>Filtered view.</b> Figures on this tab reflect the active customer/carrier filter. The population reconciliation (records → no-label → void → unattributed) applies to the whole warehouse and is only shown unfiltered.</div>`:`<div class="section"><div class="section-title">Reconciliation to ShipHero record count</div>${dataTable(['Step','Shipments','Note'],reconRows)}<div class="info">The ${fmt(R.unattributed)} unattributed shipments are shown as their own line in the breakdowns below so every table ties back to this figure. Per-carrier and per-month shipment counts sum to ${fmt(T.ship_by_carrier_sum)} and ${fmt(T.ship_by_month_sum)} rather than ${fmt(T.ship)}, because a small number of shipments carry labels from more than one carrier and are counted once in each bucket. Label counts, cost and weight are unaffected.</div>${R.tail_ship?`<div class="info"><b>Mixed sources for the final days.</b> Figures through ${esc(R.tail_from)} come from the ShipHero warehouse and are fully reconciled above. ${esc(R.tail_from)} to ${esc(R.tail_to)} come from the customer shipment export, which contains one row per shipping label and therefore <b>excludes</b> shipments with no label, shipments whose labels were all voided, and shipments with no customer record. Shipment counts for those days are distinct orders (${fmt(R.tail_ship)} orders across ${fmt(R.tail_labels)} labels, ${money(R.tail_cost)} label cost). Expect the reconciled figure for those days to come in slightly higher once the warehouse refresh runs.`:""}</div></div>`;
const warn=`<div class="info"><b>Two data caveats.</b> (1) Weight is understated: ShipHero did not populate label dimensions before April 2026, so Jan–Mar weight reads as zero. Cost figures are unaffected. (2) About 40% of labels have a blank carrier field; carrier for those was derived from tracking-number format (420-prefix 30-digit = DHL eCommerce, 1Z = UPS, UUS = UniUni, 92/93/94 = USPS, D10 = OnTrac, GFUS = GOFO, 12-digit numeric = FedEx). That is an inference, not a source field.</div>`;

const topC=S.customers.slice(0,20);
const charts=`<div class="section"><div class="section-title">Shipments and Cost</div><div class="charts-grid"><div class="chart-card"><div class="chart-title">Top 20 Customers by Shipments</div>${barSVG(topC.map(r=>r[0]),topC.map(r=>r[1]))}</div><div class="chart-card"><div class="chart-title">Top 20 Customers by Label Cost</div>${barSVG(topC.map(r=>r[0]),topC.map(r=>r[3]),true)}</div><div class="chart-card"><div class="chart-title">Shipments by Carrier</div>${barSVG(S.carriers.map(r=>r[0]),S.carriers.map(r=>r[1]))}</div><div class="chart-card"><div class="chart-title">Label Cost by Carrier</div>${barSVG(S.carriers.map(r=>r[0]),S.carriers.map(r=>r[3]),true)}</div><div class="chart-card"><div class="chart-title">Shipments by Month</div>${barSVG(S.months.map(r=>r[0]),S.months.map(r=>r[1]))}</div><div class="chart-card"><div class="chart-title">Label Cost by Month</div>${barSVG(S.months.map(r=>r[0]),S.months.map(r=>r[3]),true)}</div></div></div>`;
$('#tab-shiphero').innerHTML=banner+kpis+recon+warn+ren+charts
+`<div class="section"><div class="section-title">By Customer</div>${dataTable(['Customer','Shipments','Labels','Label Cost','Avg Cost / Shipment','Weight (lb)*'],cRows)}</div>`

+`<div class="section"><div class="section-title">By Customer &amp; Carrier</div>${dataTable(['Customer','Carrier','Shipments','Labels','Label Cost','Weight (lb)*'],ccRows)}</div>`
+`<div class="section"><div class="section-title">By Customer &amp; Month</div>${dataTable(['Customer','Month','Shipments','Labels','Label Cost','Weight (lb)*'],cmRows)}</div>`

function __b64ToBytes(b64){const bin=atob(b64);const n=bin.length;const a=new Uint8Array(n);for(let i=0;i<n;i++)a[i]=bin.charCodeAt(i);return a;}
async function __gunzip(bytes){
  if(typeof DecompressionStream==='function'){
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bytes]).stream().pipeThrough(ds);
    return await new Response(stream).text();
  }
  throw new Error('This browser cannot decompress the embedded data. Please use a current version of Chrome, Edge, Firefox or Safari.');
}
function __unpackRows(p){
  const d=p.dict,si=p.si;
  return p.rows.map(r=>r.map((v,i)=>si.indexOf(i)>=0?d[v]:v));
}
function __unpackTrack(p){
  const d=p.dict,c=p.cols,n=c.d.length,out=new Array(n);
  for(let i=0;i<n;i++){
    out[i]={d:d[c.d[i]],cu:d[c.cu[i]],ca:d[c.ca[i]],sv:d[c.sv[i]],tr:c.tr[i],or:c.or[i],
      ct:d[c.ct[i]],st:d[c.st[i]],src:d[c.src[i]],cost:c.cost[i],charged:c.charged[i],wt:c.wt[i],px:null,ontime:null};
  }
  return out;
}
async function __dzBoot(){
  const el=document.getElementById('dzLoading');
  try{
    const json=await __gunzip(__b64ToBytes(__DZB64));
    const B=JSON.parse(json);
    window.DZDATA=Object.assign({},B.meta,{
      daily:__unpackRows(B.daily), services:__unpackRows(B.services),
      states:__unpackRows(B.states), cities:__unpackRows(B.cities)
    });
    window.DZSH=B.sh;
    window.DZTRACK=__unpackTrack(B.track);
    if(el)el.remove();
    __dzApp();
  }catch(e){
    if(el)el.innerHTML='<div style="padding:40px;font-family:sans-serif;color:#b00"><b>Could not load dashboard data.</b><br>'+String(e.message||e)+'</div>';
    console.error(e);
  }
}

window.addEventListener("load",__dzBoot);
